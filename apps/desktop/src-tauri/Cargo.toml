[package]
name = "locanote-desktop"
version = "0.1.0"
description = "Locanote - A simple note-taking app"
authors = ["Bandi Akarsh"]
license = "MIT"
repository = "https://github.com/BandiAkarsh/Locanote"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For Ubuntu 24.04 compatibility - use webkit2gtk 4.1
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "updater"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Ubuntu 24.04 uses webkit2gtk 4.1 instead of 4.0
# Install with: sudo apt-get install libwebkit2gtk-4.1-dev
