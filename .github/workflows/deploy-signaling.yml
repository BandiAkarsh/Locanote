# =============================================================================
# LOCANOTE SIGNALING SERVER - GitHub Actions Workflow
# =============================================================================
# Deploys WebRTC signaling server to Cloudflare Workers
# =============================================================================

name: Deploy Signaling Server

on:
  push:
    branches: [main]
    paths:
      - "packages/signaling/**"
      - ".github/workflows/deploy-signaling.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Authenticate with Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: packages/signaling
        run: |
          wrangler secret put SIGNALING_SECRET --secret-string "${{ secrets.SIGNALING_SECRET }}"
          wrangler secret put ALLOWED_ORIGINS --secret-string "${{ vars.ALLOWED_ORIGINS }}"
          wrangler deploy --env production

      - name: Output Deployment URL
        run: |
          echo "✅ Signaling server deployed!"
          echo "WebSocket URL: wss://locanote-signaling.workers.dev"
