# =============================================================================
# TEST GITHub SECRETS
# =============================================================================
# Debug workflow to test if secrets are available
# =============================================================================

name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          echo "CLOUDFLARE_API_TOKEN exists: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "CLOUDFLARE_ACCOUNT_ID exists: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
          echo "SIGNALING_SECRET exists: ${{ secrets.SIGNALING_SECRET != '' }}"
          echo ""
          echo "PUBLIC_SIGNALING_URL: ${{ vars.PUBLIC_SIGNALING_URL }}"
          echo "ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}"
