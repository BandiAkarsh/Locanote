# =============================================================================
# LOCANOTE SIGNALING SERVER - Wrangler Configuration
# =============================================================================
# Cloudflare Worker for WebRTC peer-to-peer signaling
# 
# USAGE:
#   wrangler deploy                    # Deploy to production
#   wrangler dev                       # Local development
# =============================================================================

name = "locanote-signaling"
main = "src/index.ts"
compatibility_date = "2026-02-28"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# DURABLE OBJECTS
# =============================================================================
# WebSocket connections are managed via Durable Objects

[[durable_objects.bindings]]
name = "SIGNALING_ROOMS"
class_name = "SecuredSignalingRoom"

# Migrations - CRITICAL for Durable Objects
[[digrations]]
tag = "v1"
new_classes = ["SecuredSignalingRoom"]

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

[vars]
APP_NAME = "Locanote"
APP_VERSION = "1.0.0"
